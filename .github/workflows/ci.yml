
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Project Files
        run: |
          echo "Memeriksa file proyek..."
          test -f index.html
          echo "File index.html ditemukan."

      - name: CI Pipeline Success
        run: echo "CI Pipeline berhasil dijalankan!"
