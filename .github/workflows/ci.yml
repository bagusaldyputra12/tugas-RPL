name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependensi
        run: npm ci

      - name: Build
        run: npm run build --if-present
      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test